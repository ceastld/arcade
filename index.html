<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07060f" />
  <title>游廊 · ARCADE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307060f'/%3E%3Ccircle cx='10' cy='16' r='4' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='16' r='4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <a class="brand" href="./">游廊</a>
    <p class="tag">小游戏各自发布 · 这里只负责开门</p>
  </header>

  <main id="lobby">
    <section class="hero">
      <p class="kicker">a room of toys</p>
      <h1>游廊</h1>
      <p class="lead">点一张卡片进去玩。新游戏单独 build、单独上线，这里加一条目录就行。</p>
    </section>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <section id="play" class="play hidden">
    <div class="play-bar">
      <button type="button" id="back">返回游廊</button>
      <div class="play-meta">
        <b id="play-title"></b>
        <span id="play-sub"></span>
      </div>
      <a id="open-tab" href="#" target="_blank" rel="noreferrer">新标签打开</a>
    </div>
    <iframe id="frame" title="game" allow="autoplay"></iframe>
  </section>

  <script src="app.js"></script>
</body>
</html>
